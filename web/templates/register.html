{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daftar Akun | Rivalitas E-Sports</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo.png' %}">
    <style>
        body { background-color: #0d0f12; color: #a3a7b5; font-family: 'Open Sans', sans-serif; }
        .auth-card { background: #161920; border: 1px solid #232733; border-radius: 10px; padding: 40px; margin-top: 100px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: #232733; color: white; border: 1px solid #333; border-radius: 5px; }
        input:focus { outline: none; border-color: #29ca8e; }
        .helptext, ul.errorlist { font-size: 12px; color: #d9534f; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-offset-4 col-md-4 col-sm-12">
                <div class="auth-card">
                    <h2 class="text-center" style="color: #29ca8e; font-weight: bold; margin-bottom: 30px;">DAFTAR AKUN</h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100" style="width: 100%; background-color: #29ca8e; border: none; padding: 10px; font-weight: bold; margin-top: 15px;">DAFTAR SEKARANG</button>
                    </form>
                    <p class="text-center" style="margin-top: 20px;">Sudah punya akun? <a href="{% url 'login' %}" style="color: #29ca8e;">Login di sini</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
